name = "cdsuretasktasker"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "cdsure-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Main R2 bucket binding for digital marketplace files & proofs
[[r2_buckets]]
binding = "PROOF_STORAGE"
bucket_name = "cdsure-proofs"

# Backwards-compatible alias binding
[[r2_buckets]]
binding = "PROOFS"
bucket_name = "cdsure-proofs"

# Public environment variables ONLY.
# SECURITY: Store PAYSTACK_SECRET_KEY and PAYSTACK_WEBHOOK_SECRET using Cloudflare Worker Secrets:
#   npx wrangler secret put PAYSTACK_SECRET_KEY
#   npx wrangler secret put PAYSTACK_WEBHOOK_SECRET
[vars]
FIREBASE_PROJECT_ID = "cdsure-c360f"
ADMIN_EMAILS = "bunnynurse53@gmail.com,admin@cdsuretasks.com"
PUBLIC_PAYSTACK_PUBLIC_KEY = "pk_live_d373a3e0e4c9f6ec3916d30de7a2dacd08b70d90"
PAYSTACK_PUBLIC_KEY = "pk_live_d373a3e0e4c9f6ec3916d30de7a2dacd08b70d90"
