name = "cdsuretasktasker"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "cdsure-db"
database_id = "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

# Main R2 bucket binding for digital marketplace files & proofs
[[r2_buckets]]
binding = "PROOF_STORAGE"
bucket_name = "cdsure-proofs"

# Backwards-compatible alias binding
[[r2_buckets]]
binding = "PROOFS"
bucket_name = "cdsure-proofs"

# Public environment variables ONLY.
# SECURITY: Store PAYSTACK_SECRET_KEY and PAYSTACK_WEBHOOK_SECRET in Cloudflare Pages > Settings > Variables and secrets > Production (Encrypted/Secret):
#   npx wrangler pages secret put PAYSTACK_SECRET_KEY
#   npx wrangler pages secret put PAYSTACK_WEBHOOK_SECRET
